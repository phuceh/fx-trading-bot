; Copy this file to config.ini and fill in your details.
; config.ini is gitignored - your login/password never get committed or
; sent anywhere except to your own local MT5 terminal.

[mt5]
; Your MT5 account login number (e.g. 10011879382)
login =
; Your MT5 account password
password =
; Server name exactly as shown in MT5 (e.g. MetaQuotes-Demo)
server = MetaQuotes-Demo

[strategy]
; Comma-separated symbol names EXACTLY as they appear in your MT5
; Market Watch (some brokers suffix these, e.g. EURUSD.a - check yours)
pairs = EURUSD,GBPUSD,USDCAD
; Locked, validated parameters - see README before changing these
streak_length = 4
rsi_filter = true
rsi_threshold = 50
stop_atr_mult = 0.75
rr_ratio = 2.5

[risk]
risk_per_trade_pct = 1.0
max_daily_loss_pct = 3.0
max_drawdown_pct = 10.0
max_concurrent_trades = 3

[run]
; How often to check for a new closed H1 candle, in seconds.
; 30-60s is plenty - H1 candles only close once an hour.
poll_seconds = 30
; CRITICAL SAFETY SETTING. true = log what the bot WOULD do, place no
; orders at all. false = actually send orders to MT5 (even on a demo
; account, this moves virtual money). Leave as true until you've watched
; it run for a while and are confident it's behaving correctly.
dry_run = true
